<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Ex2 - Clipboard API</title>
    <style>
        .complex-div {
            border: 2px solid #4a90e2;
            background: #eaf6ff;
            padding: 16px;
            margin: 16px 0;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }
        .complex-div h2 {
            color: #4a90e2;
        }
        .complex-div ul {
            margin: 0;
            padding-left: 20px;
        }
        .clipboard-btn {
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            margin-right: 8px;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
        }
        .clipboard-btn svg {
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <h1>Ex2 - Clipboard API</h1>
    <div id="complex-object" class="complex-div">
        <h2>Exemple d'objecte complex</h2>
        <p>Això és un DIV amb diversos elements i estils personalitzats.</p>
        <ul>
            <li>Element 1</li>
            <li>Element 2</li>
            <li>Element 3</li>
        </ul>
    </div>
    <button id="copy-btn" class="clipboard-btn" title="Copiar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copiar DIV
    </button>
    <button id="paste-btn" class="clipboard-btn" title="Enganxar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4l2-3 2 3h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2z"/></svg>
        Enganxar contingut
    </button>
    <script type="module" src="./js/script.js"></script>
</body>
</html>
