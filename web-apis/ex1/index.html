<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demo Web API: Pantalla Completa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="app__header">
      <h1>Demo: Fullscreen API</h1>
      <button id="botoFS" class="fs-button" aria-label="Entrar a pantalla completa" title="Pantalla completa">
        <!-- Icona entrar (mostra per defecte) -->
        <svg id="icon-enter" class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M7 14H5v4h4v-2H7v-2zm0-4h2V8h2V4H5v6h2zM17 4h-4v2h2v2h2V4zM17 10h2V4h-6v2h4v4z"/>
        </svg>
        <!-- Icona sortir (oculta per defecte) -->
        <svg id="icon-exit" class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="display:none;">
          <path fill="currentColor" d="M5 16h2v2h2v2H5v-4zm12-8h-2V6h-2V4h4v4zM5 4h4v2H7v2H5V4zm14 12v4h-4v-2h2v-2h2z"/>
        </svg>
      </button>
    </header>

    <section class="app__content">
      <p>Aquesta pàgina mostra un exemple de com utilitzar la <strong>Fullscreen API</strong>. Prem el botó per alternar entre pantalla completa i normal.</p>
      <div class="card">
        <h2>Contingut ampliable</h2>
        <p>Qualsevol element pot passar a pantalla completa; en aquest exemple ampliem tot el document (`document.documentElement`).</p>
      </div>
    </section>
  </main>

  <script src="js/script.js" type="module"></script>
</body>
</html>
