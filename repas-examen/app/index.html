<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <style>
        #myDiv {
            width: 200px;
            height: 100px;
            background-color: #e0e0e0;
            border: 2px solid #008040;
            margin-bottom: 10px;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>DOM Elements Practice</h1>
    <div id="myDiv" style="color: blue;">This is a div element</div>
    <img id="myImg" src="https://via.placeholder.com/100" width="100" height="100" alt="Placeholder">
    <a id="myLink" href="https://www.example.com" target="_blank">Visit Example.com</a>
    <button id="myButton" type="button">Click Me</button>
    <textarea id="myTextarea" rows="3" cols="20" maxlength="100">Sample text</textarea>
    <table id="myTable">
        <tbody>
            <tr><td>Row 1 Col 1</td><td>Row 1 Col 2</td><td>Row 1 Col 3</td></tr>
            <tr><td>Row 2 Col 1</td><td>Row 2 Col 2</td><td>Row 2 Col 3</td></tr>
            <tr><td>Row 3 Col 1</td><td>Row 3 Col 2</td><td>Row 3 Col 3</td></tr>
        </tbody>
    </table>
    <hr>
    <h2>Exemple Cronòmetre</h2>
    <div id="cronometre-demo"></div>
    <script type="module" src="./js/clipboard.js"></script>
</body>
</html>
